<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menuthere update</title>
  <style>
    :root { --accent: #b4532a; --accent-ink: #8e3f1f; --ink: #18181b; --muted: #71717a; --line: #e4e4e7; --bg: #ffffff; --err: #b91c1c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; padding: 22px 24px 20px; user-select: none; }
    .head { display: flex; align-items: center; gap: 12px; }
    .head img { width: 40px; height: 40px; border-radius: 10px; }
    h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
    .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .body { flex: 1; margin-top: 18px; }
    .bar { height: 8px; border-radius: 999px; background: #f4f4f5; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
    .bar.indeterminate > i { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(320%); } }
    .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
    .msg { font-size: 13px; line-height: 1.5; color: #3f3f46; }
    .msg.err { color: var(--err); }
    .detail { font-size: 11.5px; color: var(--muted); margin-top: 6px; word-break: break-word; max-height: 48px; overflow: auto; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; }
    button { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    button:hover { background: #f4f4f5; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-ink); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="head">
    <img id="logo" alt="" />
    <div>
      <h1 id="title">Updating Menuthere</h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <div class="body">
    <div id="progress">
      <div class="bar" id="bar"><i id="fill"></i></div>
      <div class="meta"><span id="pct">Starting…</span><span id="size"></span></div>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="detail" id="detail" hidden></div>
  </div>

  <div class="actions">
    <button id="later">Later</button>
    <button id="download" hidden>Download installer</button>
    <button id="retry" hidden>Try again</button>
    <button id="restart" class="primary" hidden>Restart now</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const mb = (n) => (n / 1048576).toFixed(1) + " MB";

    function render(s) {
      if (!s) return;
      if (s.logo) $("logo").src = s.logo;
      const v = s.version ? "Version " + s.version : "";
      $("sub").textContent = v;
      $("progress").hidden = s.phase !== "downloading";
      $("msg").hidden = s.phase === "downloading";
      $("msg").classList.toggle("err", s.phase === "error");
      $("detail").hidden = !(s.phase === "error" && s.detail);
      $("restart").hidden = s.phase !== "ready";
      $("retry").hidden = s.phase !== "error";
      $("download").hidden = s.phase !== "error";
      $("later").textContent = s.phase === "error" ? "Close" : (s.phase === "ready" ? "Later" : "Hide");

      if (s.phase === "downloading") {
        $("title").textContent = "Downloading the update";
        const pct = Math.max(0, Math.min(100, Math.round(s.percent || 0)));
        $("bar").classList.toggle("indeterminate", !s.total);
        $("fill").style.width = s.total ? pct + "%" : "";
        $("pct").textContent = s.total ? pct + "%" : "Starting…";
        $("size").textContent = s.total
          ? mb(s.transferred || 0) + " of " + mb(s.total) + (s.bytesPerSecond ? " · " + mb(s.bytesPerSecond) + "/s" : "")
          : "";
      } else if (s.phase === "ready") {
        $("title").textContent = "Update ready";
        $("msg").textContent = "Restart Menuthere to finish. It takes a few seconds; printing pauses meanwhile.";
      } else if (s.phase === "installing") {
        $("title").textContent = "Installing…";
        $("msg").textContent = "Menuthere closes and opens again on its own.";
        $("later").hidden = true;
      } else if (s.phase === "error") {
        $("title").textContent = "Update did not finish";
        $("msg").textContent = "Menuthere keeps working as it is. Try again, or download the installer and run it.";
        $("detail").textContent = s.detail || "";
      }
    }

    window.updater.onState(render);
    window.updater.getState().then(render);
    $("restart").addEventListener("click", () => window.updater.restart());
    $("later").addEventListener("click", () => window.updater.later());
    $("retry").addEventListener("click", () => window.updater.retry());
    $("download").addEventListener("click", () => window.updater.download());
  </script>
</body>
</html>
