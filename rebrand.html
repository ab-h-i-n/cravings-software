<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:;" />
  <title>Cravings.live is now Menuthere</title>
  <style>
    :root { --accent: #b4532a; --accent-ink: #8e3f1f; --ink: #18181b; --muted: #71717a; --line: #e4e4e7; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif; color: var(--ink); background: #fff; display: flex; flex-direction: column; padding: 24px 26px 20px; user-select: none; }
    h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; text-align: center; }
    .change { display: flex; align-items: center; justify-content: center; gap: 22px; margin: 20px 0 16px; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 120px; }
    .brand img { width: 64px; height: 64px; border-radius: 15px; }
    .brand.old img { opacity: .55; filter: grayscale(.2); }
    .brand span { font-size: 13.5px; font-weight: 600; }
    .brand.old span { color: var(--muted); text-decoration: line-through; text-decoration-color: #a1a1aa; }
    .arrow { font-size: 22px; color: var(--accent); margin-bottom: 26px; }
    p { margin: 0; font-size: 13px; line-height: 1.55; color: #3f3f46; text-align: center; }
    .actions { display: flex; justify-content: center; margin-top: auto; padding-top: 16px; }
    button { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 26px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    button:hover { background: var(--accent-ink); }
  </style>
</head>
<body>
  <h1>We have a new name and logo</h1>
  <div class="change">
    <div class="brand old"><img src="build/old-icon.png" alt="" /><span>Cravings.live</span></div>
    <div class="arrow">→</div>
    <div class="brand"><img src="build/new-icon-256.png" alt="" /><span>Menuthere</span></div>
  </div>
  <p>Cravings.live is now <b>Menuthere</b>. Same app: you are still signed in, and your printers and bill layouts are as you left them. Look for Menuthere on your desktop and in the Start menu.</p>
  <div class="actions"><button id="ok" autofocus>Got it</button></div>
  <script>
    document.getElementById("ok").addEventListener("click", () => window.close());
    document.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === "Escape") window.close(); });
  </script>
</body>
</html>
